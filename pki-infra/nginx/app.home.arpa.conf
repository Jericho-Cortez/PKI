# nginx : reverse proxy mTLS devant un service du homelab (ex. Open WebUI sur le Dell OptiPlex).
# ⚠ NON TESTÉ dans ce dépôt : le test automatisé (scripts/99-demo-test.sh) utilise openssl s_server.
#   À valider sur le Dell (ou WSL / Docker) avant la démo :  nginx -t && nginx -s reload
#
# Fichiers à copier sur le serveur (depuis pki-data/) :
#   issued/app.home.arpa/app.home.arpa-chain.crt  -> /etc/nginx/pki/server-chain.crt   (serveur + intermédiaire)
#   issued/app.home.arpa/app.home.arpa.key        -> /etc/nginx/pki/server.key         (chmod 600, root)
#   deploy/ca-chain.pem                           -> /etc/nginx/pki/ca-chain.pem       (intermédiaire + racine)
#   deploy/crl-bundle.pem                         -> /etc/nginx/pki/crl-bundle.pem     (CRL intermédiaire + racine)

server {
    listen 443 ssl;
    server_name app.home.arpa;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_certificate     /etc/nginx/pki/server-chain.crt;
    ssl_certificate_key /etc/nginx/pki/server.key;

    # --- mTLS : le client DOIT présenter un certificat émis par notre PKI -----
    ssl_client_certificate /etc/nginx/pki/ca-chain.pem;
    ssl_verify_client      on;
    ssl_verify_depth       2;

    # --- Révocation : nginx vérifie TOUTE la chaîne -> CRL de l'intermédiaire ET de la racine,
    #     dans le même fichier. nginx ne lit la CRL qu'au (re)chargement : `nginx -s reload`
    #     après chaque révocation.
    ssl_crl /etc/nginx/pki/crl-bundle.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;                    # Open WebUI (à adapter)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-SSL-Client-DN   $ssl_client_s_dn;   # identité du client authentifié
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_http_version 1.1;                              # WebSocket (Open WebUI)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Redirection HTTP -> HTTPS
server {
    listen 80;
    server_name app.home.arpa;
    return 301 https://$host$request_uri;
}
